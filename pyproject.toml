[project]
name = "chatbot-api"
version = "0.1.0"
description = "FastAPI + LangGraph 멀티 에이전트 챗봇"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 웹
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",

    # EmailStr 검증에 필요하다.
    "pydantic[email]>=2.9",

    # LangGraph / LLM
    "langchain>=1.3,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-google-genai>=4.0",

    # Supabase
    "psycopg[binary,pool]>=3.2",
    "supabase>=2.10",
    "langchain-tavily>=0.2.18",

    # PDF 파서
    "pymupdf>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# 패키지로 배포하지 않는 앱이라 빌드 설정 없이 의존성만 관리한다.
[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff — 린트 + 포맷 (코드 퀄리티 유지 및 빠른 디버깅용)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (미사용 import·변수 자동 제거)
    "I",        # import 정렬
    "B",        # bugbear (흔한 버그 패턴 방지)
    "UP",       # 최신 문법으로 업그레이드
    "SIM",      # 단순화 가능한 코드
    "ASYNC",    # async 코드에서 블로킹 호출 감지
]
ignore = [
    "B008",     # FastAPI Depends() 기본값 패턴 허용
    "E501",     # 줄 길이는 포매터에 위임
    "SIM117",   # 중첩 with 주석 허용
]

[tool.ruff.lint.per-file-ignores]
# main.py 는 LANGGRAPH_STRICT_MSGPACK 설정 뒤에 import 해야 한다.
"app/main.py" = ["E402"]
# 스크립트는 sys.path 를 고친 뒤 import 한다.
"scripts/*.py" = ["E402"]

# ---------------------------------------------------------------------------
# Pytest (핵심 비즈니스 로직 검증용)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 폴더가 다른 같은 이름의 테스트 파일(test_service.py 등)이 충돌하지 않게 한다.
addopts = "-q --import-mode=importlib"

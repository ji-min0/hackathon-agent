# 서버 배포용. AWS EC2, NCP 서버 등 Docker 가 있는 Ubuntu 서버면 어디서나 같다.
# 서버 .env 에 DOMAIN=<공인 IP>, ACME_PROFILE=shortlived 를 넣고 ./scripts/deploy.sh
# compose 는 같은 폴더의 .env 를 읽어 ${DOMAIN} 을 채운다. 자세한 순서는 docs/deploy.md 참고.

services:
  app:
    build: .
    env_file: .env
    environment:
      # Caddy 가 HTTPS 를 붙이므로 로그인 쿠키에 Secure 를 켠다.
      COOKIE_SECURE: "true"
    # Caddy 가 넘겨 주는 X-Forwarded-* 헤더를 믿어야 https 로 인식한다.
    # 워커는 1개다. 같은 대화방 동시 실행 가드가 프로세스 안에서만 동작한다(app/chat/concurrency.py).
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 접속 주소. 서버 공인 IP 또는 도메인. 예) 52.78.121.248, chat.example.com
      DOMAIN: ${DOMAIN:?서버 .env 에 DOMAIN 을 넣으세요. 예) DOMAIN=52.78.121.248}
      # IP 로 쓰면 shortlived(6일 인증서, 자동 갱신). 도메인이면 비워 둔다(classic).
      ACME_PROFILE: ${ACME_PROFILE:-classic}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 HTTPS 인증서를 보관한다. 지우면 다시 발급받는다.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

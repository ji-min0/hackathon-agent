# 서버 배포용. AWS EC2, NCP 서버 등 Docker 가 있는 Ubuntu 서버면 어디서나 같다.
#   DOMAIN=1-2-3-4.sslip.io docker compose up -d --build
# 자세한 순서는 docs/deploy.md 참고.

services:
  app:
    build: .
    env_file: .env
    environment:
      # Caddy 가 HTTPS 를 붙이므로 로그인 쿠키에 Secure 를 켠다.
      COOKIE_SECURE: "true"
    # Caddy 가 넘겨 주는 X-Forwarded-* 헤더를 믿어야 https 로 인식한다.
    # 워커는 1개다. 같은 대화방 동시 실행 가드가 프로세스 안에서만 동작한다(app/chat/concurrency.py).
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 접속 주소. 도메인이 없으면 "서버IP(점을 -로).sslip.io" 를 쓴다. 예) 3-35-10-7.sslip.io
      DOMAIN: ${DOMAIN:?DOMAIN 을 지정하세요. 예) DOMAIN=3-35-10-7.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 HTTPS 인증서를 보관한다. 지우면 다시 발급받는다.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# CI: 모든 push·PR 에서 린트·포맷·테스트(make check)를 돌린다. 배포는 하지 않는다.
# CD: main 에 push 되고 CI 가 통과했을 때만 AWS EC2 에 배포한다.
#
# CD 는 SSH 를 쓰지 않는다.
#   1) GitHub OIDC 로 IAM 역할(github-actions-deploy)의 임시 권한을 받는다. 저장된 AWS 키가 없다.
#   2) AWS SSM Run Command 로 EC2 안의 SSM 에이전트에게 배포 명령을 보낸다. 22번 포트가 필요 없다.
# 필요한 설정: CFN 스택(deploy/aws/ec2-oidc-cfn.yml)과
#   GitHub Secret AWS_ROLE_ARN = 스택 출력 DeployRoleArn (docs/deploy.md).

name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  # CFN 템플릿(deploy/aws/ec2-oidc-cfn.yml)의 AppName 과 같아야 한다.
  # EC2 Name 태그이자 서버 폴더 이름(/home/ubuntu/<APP_NAME>)이다.
  APP_NAME: hackathon-agent

jobs:
  ci:
    name: CI (lint · format · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --frozen

      # 테스트는 실제 DB·LLM 을 부르지 않는다. 더미 환경 변수는 tests/conftest.py 가 채운다.
      - name: make check
        run: make check

  cd:
    name: CD (deploy to EC2 via SSM)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 배포가 겹치지 않게 한 번에 하나씩만 돈다. 진행 중인 배포는 끊지 않고 끝날 때까지 기다린다.
    concurrency:
      group: deploy
      cancel-in-progress: false
    # OIDC 토큰을 받으려면 id-token 쓰기 권한이 필요하다.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: AWS 임시 권한 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 대상 찾기
        id: target
        run: |
          read -r IID IP < <(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$APP_NAME" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].[InstanceId,PublicIpAddress]" --output text)
          if [ -z "$IID" ] || [ "$IID" = "None" ]; then
            echo "실행 중인 $APP_NAME 인스턴스가 없습니다"; exit 1
          fi
          echo "instance=$IID" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "대상: $IID ($IP)"

      - name: SSM 으로 배포 명령 보내기
        id: deploy
        run: |
          # SSM 은 root 로 실행하므로 ubuntu 계정으로 바꿔서 배포한다.
          # 서버에서 추적 파일을 고쳐도 GitHub 의 main 으로 맞춘다. .env 는 추적하지 않아 그대로 남는다.
          SCRIPT="sudo -u ubuntu -H bash -c 'set -euo pipefail; cd ~/$APP_NAME;
            git fetch -q origin main; git reset -q --hard origin/main; git log --oneline -1;
            docker compose up -d --build --wait; docker image prune -f > /dev/null'"
          jq -n --arg c "$SCRIPT" '{commands: [$c]}' > params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "command=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM 명령: $CMD_ID"

      - name: 배포 결과 기다리기
        run: |
          IID=${{ steps.target.outputs.instance }}
          CMD_ID=${{ steps.deploy.outputs.command }}
          # 이미지를 새로 빌드하면 몇 분 걸린다. 최대 15분 기다린다.
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          echo "상태: $STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text
          [ "$STATUS" = "Success" ]

      - name: 헬스체크
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "https://${{ steps.target.outputs.ip }}/health"; then
              echo; echo "배포 완료"; exit 0
            fi
            sleep 5
          done
          echo "헬스체크 실패: 서버에서 docker compose logs app 을 확인하세요"
          exit 1
